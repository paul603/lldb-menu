<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu Hybride — Le Lab du Bonheur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* Vidéo en fond */
  #video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: fill;
    z-index: 1;
  }

  /* Overlay transparent par-dessus */
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  /* Masque pour produits en rupture */
  .product-mask {
    position: absolute;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #FF0000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FF0000;
    font-family: 'Trebuchet MS', sans-serif;
    font-weight: 900;
    font-size: 1.8vw;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .product-mask.out-of-stock {
    opacity: 1;
  }

  /* Badge de statut (dernière MAJ, erreur) */
  .status-badge {
    position: fixed;
    bottom: 10px;
    right: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    font-weight: 600;
    z-index: 999;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  .status-badge.online {
    background: rgba(52, 199, 89, 0.9);
    color: white;
  }

  .status-badge.offline {
    background: rgba(255, 59, 48, 0.9);
    color: white;
    opacity: 1;
  }

  .status-badge.warning {
    background: rgba(255, 149, 0, 0.9);
    color: white;
    opacity: 1;
  }

  /* Rotation pour République */
  body.rot90 #video-bg,
  body.rot90 #overlay {
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }
</style>
</head>
<body>
<!-- Vidéo de fond -->
<video id="video-bg" autoplay muted loop playsinline></video>

<!-- Overlay avec masques de produits -->
<div id="overlay"></div>

<!-- Badge de statut -->
<div id="status-badge" class="status-badge online"></div>

<script>
(function () {
  var BASE = '/videos/';
  var SUPABASE_URL = 'https://ljcixbsebbwvbkkohfxq.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqY2l4YnNlYmJ3dmJra29oZnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NDQyNDgsImV4cCI6MjA3MTEyMDI0OH0.jJ_mZI383CcA2h5uNbIRFqsycPZoGqIVVgbS8hHrEKc';

  var STORES = {
    republique: 'b5be6a9d-4c3d-4dc7-9c8c-b85df7385176',
    asnieres: 'ebc6c057-765b-4972-b7ae-d67a62eb2729',
    odeon: '6cb8093b-4290-4414-89c2-8132273dac73',
    nantes: 'fe107d26-9d1b-4b0a-b037-1d3bbd19bc12'
  };

  // Positions MODE PAYSAGE (Asnières, Odéon, Nantes)
  // Layout vertical : 4 colonnes à droite de l'écran
  var PRODUCT_POSITIONS_LANDSCAPE = {
    // COLONNE 1 - LES PETITS PRIX (top 5-23%)
    'DIRTY BERRY': { top: 5, left: 45, width: 6, height: 3.5 },
    'CRITICAL': { top: 9, left: 45, width: 6, height: 3.5 },
    'CHEESE': { top: 13, left: 45, width: 6, height: 3.5 },
    'BUBBLE': { top: 17, left: 45, width: 6, height: 3.5 },
    'PURPLE HAZE': { top: 21, left: 45, width: 6, height: 3.5 },

    // COLONNE 2 - LES CLASSIQUES (top 28-50%)
    'BLUE ZUSHI V2': { top: 28, left: 45, width: 6, height: 3.5 },
    'LOUISE ATAK': { top: 32, left: 45, width: 6, height: 3.5 },
    'WEDDING CAKE': { top: 36, left: 45, width: 6, height: 3.5 },
    'RAINBOW RUNTZ V2': { top: 40, left: 45, width: 6, height: 3.5 },
    'MASTER KUSH': { top: 44, left: 45, width: 6, height: 3.5 },
    'NORTHERN LIGHTS': { top: 48, left: 45, width: 6, height: 3.5 },

    // COLONNE 3 - LES PRIMEES (top 53-70%)
    'PINEAPPLE': { top: 53, left: 45, width: 6, height: 3.5 },
    'AMNESIA HYDRO': { top: 57, left: 45, width: 6, height: 3.5 },
    'GELATO': { top: 61, left: 45, width: 6, height: 3.5 },
    'FIRE OF GOD': { top: 65, left: 45, width: 6, height: 3.5 },
    'MELA SOUR': { top: 69, left: 45, width: 6, height: 3.5 },

    // COLONNE 4 - LES RESINES (top 74-97%, items compacts)
    'GORILLA PRO': { top: 74, left: 45, width: 6, height: 2.5 },
    'DOUBLE ZERO': { top: 77, left: 45, width: 6, height: 2.5 },
    'MOUSSE CALI I.A.': { top: 80, left: 45, width: 6, height: 2.5 },
    'NEW AFGHAN V3': { top: 83, left: 45, width: 6, height: 2.5 },
    'X3 FILTRE 120U': { top: 86, left: 45, width: 6, height: 2.5 },
    'ATOMIQUE': { top: 89, left: 45, width: 6, height: 2.5 },
    'OUNAS EDDIN CALIFO': { top: 92, left: 45, width: 6, height: 2.5 },
    'BAB BERRED': { top: 95, left: 45, width: 6, height: 2.5 },
    'DRY SIFT by LLDB': { top: 74, left: 68, width: 6, height: 2.5 },
    'ICE O LATOR': { top: 77, left: 68, width: 6, height: 2.5 },
    'FROZEN PAPAYA': { top: 80, left: 68, width: 6, height: 2.5 },
    'OG KUSH': { top: 83, left: 68, width: 6, height: 2.5 }
  };

  // Positions MODE PORTRAIT (République seulement)
  // Layout horizontal : 4 bandes après rotation 90°
  var PRODUCT_POSITIONS_PORTRAIT = {
    // BANDE 1 - LES PETITS PRIX (ligne du haut)
    'DIRTY BERRY': { top: 15, left: 18, width: 6, height: 8 },
    'CRITICAL': { top: 15, left: 29, width: 6, height: 8 },
    'CHEESE': { top: 15, left: 40, width: 6, height: 8 },
    'BUBBLE': { top: 15, left: 51, width: 6, height: 8 },
    'PURPLE HAZE': { top: 15, left: 62, width: 6, height: 8 },

    // BANDE 2 - LES CLASSIQUES
    'BLUE ZUSHI': { top: 35, left: 10, width: 7, height: 8 },
    'LOUISE OG': { top: 35, left: 22, width: 7, height: 8 },
    'WEDDING CAKE': { top: 35, left: 34, width: 7, height: 8 },
    'RAINBOW RUNTZ V2': { top: 35, left: 46, width: 7, height: 8 },
    'SUPER SKUNK': { top: 35, left: 58, width: 7, height: 8 },
    'NORTHERN LIGHTS': { top: 35, left: 70, width: 7, height: 8 },

    // BANDE 3 - LES PRIMEES
    'PINEAPLI': { top: 58, left: 15, width: 7, height: 8 },
    'AMNESIA HYDRO': { top: 58, left: 28, width: 7, height: 8 },
    'GELATO': { top: 58, left: 41, width: 7, height: 8 },
    'FIRE OG GOD': { top: 58, left: 54, width: 7, height: 8 },
    'MELA SOUR': { top: 58, left: 67, width: 7, height: 8 },

    // BANDE 4 - LES RESINES (2 lignes)
    'GORILLA PRO': { top: 78, left: 8, width: 6, height: 6 },
    'DOUBLE SOUR LA': { top: 78, left: 18, width: 6, height: 6 },
    'NEW AFGHAN V3': { top: 78, left: 28, width: 6, height: 6 },
    'X FILTREY 30U': { top: 78, left: 38, width: 6, height: 6 },
    'ALCHIMIA': { top: 78, left: 48, width: 6, height: 6 },
    'OUNAS EDDIN CALIFO': { top: 78, left: 58, width: 6, height: 6 },
    'DAYARA': { top: 78, left: 68, width: 6, height: 6 },
    'ICE ISOLATOR': { top: 88, left: 13, width: 6, height: 6 },
    'BANANA YELLOW': { top: 88, left: 23, width: 6, height: 6 },
    'ICE O LATOR': { top: 88, left: 33, width: 6, height: 6 },
    'LEMON HAZE': { top: 88, left: 43, width: 6, height: 6 },
    'HI CRISTAL': { top: 88, left: 53, width: 6, height: 6 }
  };

  // Détection boutique (DOIT être fait AVANT de sélectionner PRODUCT_POSITIONS)
  var qs = window.location.search;
  var boutique = '';
  var m = qs.match(/[?&]b=([a-z0-9-]+)/i);
  if (m) {
    boutique = m[1].toLowerCase();
  } else {
    var segs = window.location.pathname.split('/').filter(function (s) { return s.length > 0; });
    var last = segs.length ? segs[segs.length - 1].toLowerCase().replace(/\.html?$/, '') : '';
    if (last && STORES[last]) {
      boutique = last;
    }
  }

  var storeId = STORES[boutique];

  // Sélection des positions selon la boutique
  var PRODUCT_POSITIONS = boutique === 'republique'
    ? PRODUCT_POSITIONS_PORTRAIT
    : PRODUCT_POSITIONS_LANDSCAPE;

  // Validation boutique
  if (!boutique || !storeId) {
    console.error('Boutique non reconnue:', boutique);
    updateStatus('warning', 'BOUTIQUE INCONNUE');
    // Essayer de charger la vidéo par défaut quand même
  }

  // Auto-rotation République
  if (boutique === 'republique') {
    document.body.classList.add('rot90');
  }

  // Fonction pour mettre à jour le badge de statut
  function updateStatus(type, message) {
    var badge = document.getElementById('status-badge');
    if (!badge) return;

    badge.className = 'status-badge ' + type;
    badge.textContent = message;

    // Auto-masquer après 10s si online
    if (type === 'online') {
      setTimeout(function() {
        badge.style.opacity = '0.3';
      }, 10000);
    }
  }

  // Charger la vidéo
  var video = document.getElementById('video-bg');
  video.src = BASE + 'menu-' + boutique + '.mp4';
  video.onerror = function () {
    video.src = BASE + 'menu.mp4';
  };

  // Créer les masques de produits
  function createProductMasks() {
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';

    for (var productName in PRODUCT_POSITIONS) {
      var pos = PRODUCT_POSITIONS[productName];
      var mask = document.createElement('div');
      mask.className = 'product-mask';
      mask.dataset.product = productName;
      mask.style.top = pos.top + '%';
      mask.style.left = pos.left + '%';
      mask.style.width = pos.width + '%';
      mask.style.height = pos.height + '%';
      mask.textContent = 'RUPTURE';
      overlay.appendChild(mask);
    }
  }

  // Charger le stock depuis Supabase
  function loadStock() {
    if (!storeId) {
      updateStatus('warning', 'BOUTIQUE NON CONFIGURÉE');
      return;
    }

    fetch(SUPABASE_URL + '/rest/v1/menu_items?select=name,id&is_active=eq.true', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (items) {
      var itemIds = items.map(function (i) { return i.id; });
      var itemNames = {};
      items.forEach(function (i) { itemNames[i.id] = i.name; });

      // Charger le stock
      return fetch(SUPABASE_URL + '/rest/v1/menu_stock?select=item_id,in_stock&store_id=eq.' + storeId, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (stock) {
        // Appliquer les masques
        var stockMap = {};
        stock.forEach(function (s) {
          stockMap[s.item_id] = s.in_stock;
        });

        document.querySelectorAll('.product-mask').forEach(function (mask) {
          var productName = mask.dataset.product;
          var item = items.find(function (i) { return i.name === productName; });

          if (item) {
            var inStock = stockMap[item.id];
            if (inStock === false) {
              mask.classList.add('out-of-stock');
            } else {
              mask.classList.remove('out-of-stock');
            }
          }
        });

        // Mise à jour réussie
        var now = new Date();
        var timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        updateStatus('online', 'MAJ ' + timeStr);
      });
    })
    .catch(function (err) {
      console.error('Erreur chargement stock:', err);
      updateStatus('offline', 'HORS LIGNE');
    });
  }

  // Init
  createProductMasks();
  loadStock();

  // Refresh toutes les 60s
  setInterval(loadStock, 60000);

  // Plein écran
  document.addEventListener('click', function () {
    var el = document.documentElement;
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  });
})();
</script>
</body>
</html>
