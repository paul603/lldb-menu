<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu Hybride — Le Lab du Bonheur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* Vidéo en fond */
  #video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #0d2b1d;
    z-index: 1;
  }

  /* Overlay transparent par-dessus */
  #overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 16 / 9;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    max-height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  /* Masque pour produits en rupture */
  .product-mask {
    position: absolute;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #FF0000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FF0000;
    font-family: 'Trebuchet MS', sans-serif;
    font-weight: 900;
    font-size: 1.8vw;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .product-mask.out-of-stock {
    opacity: 1;
  }

  /* Badge de statut (dernière MAJ, erreur) */
  .status-badge {
    position: fixed;
    bottom: 10px;
    right: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    font-weight: 600;
    z-index: 999;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  .status-badge.online {
    background: rgba(52, 199, 89, 0.9);
    color: white;
  }

  .status-badge.offline {
    background: rgba(255, 59, 48, 0.9);
    color: white;
    opacity: 1;
  }

  .status-badge.warning {
    background: rgba(255, 149, 0, 0.9);
    color: white;
    opacity: 1;
  }

  /* Rotation pour République */
  body.rot90 #video-bg {
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }

  body.rot90 #overlay {
    width: min(100vh, calc(100vw * 16 / 9));
    max-height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }
</style>
</head>
<body>
<!-- Vidéo de fond -->
<video id="video-bg" autoplay muted loop playsinline></video>

<!-- Overlay avec masques de produits -->
<div id="overlay"></div>

<!-- Badge de statut -->
<div id="status-badge" class="status-badge online"></div>

<script>
(function () {
  var BASE = '/videos/';
  var SUPABASE_URL = 'https://ljcixbsebbwvbkkohfxq.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqY2l4YnNlYmJ3dmJra29oZnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NDQyNDgsImV4cCI6MjA3MTEyMDI0OH0.jJ_mZI383CcA2h5uNbIRFqsycPZoGqIVVgbS8hHrEKc';

  var STORES = {
    republique: 'b5be6a9d-4c3d-4dc7-9c8c-b85df7385176',
    asnieres: 'ebc6c057-765b-4972-b7ae-d67a62eb2729',
    odeon: '6cb8093b-4290-4414-89c2-8132273dac73',
    nantes: 'fe107d26-9d1b-4b0a-b037-1d3bbd19bc12'
  };

  // Positions des produits sur la vidéo MENU 2026 (1920x1080 paysage).
  // Coordonnees en % de la zone video 16:9, mesurees sur le rendu de reference.
  // Toutes les boutiques diffusent la meme video ; Republique est seulement
  // pivotee de 90deg par CSS, overlay compris, donc un seul jeu suffit.
  //
  // Mesures de reference (largeur 1920, hauteur 1080) :
  //   colonne gauche : noms de x=585 a x=800   -> left 30.5%, width 11.5%
  //   colonne droite : noms de x=1235 a x=1450 -> left 64.3%, width 11.5%
  //   lignes petits prix   : y=105,157,208,259,311
  //   lignes classiques    : y=458,508,558,608,659,710
  //   lignes primees       : y=108,158,208,259,310
  //   lignes resines       : y=457,507,554,602,651,699,746,794,842,890
  var COL_L = 30.5, COL_R = 64.3, COL_W = 11.5, ROW_H = 3.6;

  function row(y) { return (y / 1080) * 100 - ROW_H / 2; }

  var PRODUCT_POSITIONS = {
    // LES PETITS PRIX (colonne gauche, haut)
    'DIRTY BERRY':        { top: row(105), left: COL_L, width: COL_W, height: ROW_H },
    'CRITICAL':           { top: row(157), left: COL_L, width: COL_W, height: ROW_H },
    'CHEESE':             { top: row(208), left: COL_L, width: COL_W, height: ROW_H },
    'BUBBLE':             { top: row(259), left: COL_L, width: COL_W, height: ROW_H },
    'PURPLE HAZE':        { top: row(311), left: COL_L, width: COL_W, height: ROW_H },

    // LES CLASSIQUES (colonne gauche, bas)
    'BLUE ZUSHI V2':      { top: row(458), left: COL_L, width: COL_W, height: ROW_H },
    'LOUISE ATAK':        { top: row(508), left: COL_L, width: COL_W, height: ROW_H },
    'WEDDING CAKE':       { top: row(558), left: COL_L, width: COL_W, height: ROW_H },
    'RAINBOW RUNTZ V2':   { top: row(608), left: COL_L, width: COL_W, height: ROW_H },
    'MASTER KUSH':        { top: row(659), left: COL_L, width: COL_W, height: ROW_H },
    'NORTHERN LIGHTS':    { top: row(710), left: COL_L, width: COL_W, height: ROW_H },

    // LES PRIMEES (colonne droite, haut)
    'PINEAPPLE':          { top: row(108), left: COL_R, width: COL_W, height: ROW_H },
    'AMNESIA HYDRO':      { top: row(158), left: COL_R, width: COL_W, height: ROW_H },
    'TROPICAL':           { top: row(208), left: COL_R, width: COL_W, height: ROW_H },
    'FIRE OF GOD':        { top: row(259), left: COL_R, width: COL_W, height: ROW_H },
    'MELA SOUR':          { top: row(310), left: COL_R, width: COL_W, height: ROW_H },

    // LES RESINES (colonne droite, bas)
    'DOUBLE ZERO':        { top: row(457), left: COL_R, width: COL_W, height: ROW_H },
    'MOUSSE CALI I.A.':   { top: row(507), left: COL_R, width: COL_W, height: ROW_H },
    'NEW AFGHAN V3':      { top: row(554), left: COL_R, width: COL_W, height: ROW_H },
    'X3 FILTRE 120U':     { top: row(602), left: COL_R, width: COL_W, height: ROW_H },
    'ATOMIQUE':           { top: row(651), left: COL_R, width: COL_W, height: ROW_H },
    'OUNAS EDDIN CALIPO': { top: row(699), left: COL_R, width: COL_W, height: ROW_H },
    'BAB BERRED':         { top: row(746), left: COL_R, width: COL_W, height: ROW_H },
    'DRY SIFT by LLDB':   { top: row(794), left: COL_R, width: COL_W, height: ROW_H },
    'ICE O LATOR':        { top: row(842), left: COL_R, width: COL_W, height: ROW_H },
    'FROZEN PAPAYA OU OG KUSH': { top: row(890), left: COL_R, width: COL_W, height: ROW_H }
  };

  // Détection boutique (DOIT être fait AVANT de sélectionner PRODUCT_POSITIONS)
  var qs = window.location.search;
  var boutique = '';
  var m = qs.match(/[?&]b=([a-z0-9-]+)/i);
  if (m) {
    boutique = m[1].toLowerCase();
  } else {
    var segs = window.location.pathname.split('/').filter(function (s) { return s.length > 0; });
    var last = segs.length ? segs[segs.length - 1].toLowerCase().replace(/\.html?$/, '') : '';
    if (last && STORES[last]) {
      boutique = last;
    }
  }

  var storeId = STORES[boutique];

  // Validation boutique
  if (!boutique || !storeId) {
    console.error('Boutique non reconnue:', boutique);
    updateStatus('warning', 'BOUTIQUE INCONNUE');
    // Essayer de charger la vidéo par défaut quand même
  }

  // Auto-rotation République
  if (boutique === 'republique') {
    document.body.classList.add('rot90');
  }

  // Fonction pour mettre à jour le badge de statut
  function updateStatus(type, message) {
    var badge = document.getElementById('status-badge');
    if (!badge) return;

    badge.className = 'status-badge ' + type;
    badge.textContent = message;

    // Auto-masquer après 10s si online
    if (type === 'online') {
      setTimeout(function() {
        badge.style.opacity = '0.3';
      }, 10000);
    }
  }

  // Charger la vidéo (fallback sur la video paysage generique)
  var video = document.getElementById('video-bg');
  video.src = BASE + 'menu-' + (boutique || 'paysage') + '.mp4';
  video.onerror = function () {
    if (video.src.indexOf('menu-paysage') === -1) {
      video.src = BASE + 'menu-paysage.mp4';
    }
  };

  // Mode calibration : ajouter ?debug=1 pour voir toutes les zones
  var DEBUG = /[?&]debug=1/.test(qs);

  // Créer les masques de produits
  function createProductMasks() {
    var overlay = document.getElementById('overlay');
    overlay.innerHTML = '';

    for (var productName in PRODUCT_POSITIONS) {
      var pos = PRODUCT_POSITIONS[productName];
      var mask = document.createElement('div');
      mask.className = 'product-mask';
      mask.dataset.product = productName;
      mask.style.top = pos.top + '%';
      mask.style.left = pos.left + '%';
      mask.style.width = pos.width + '%';
      mask.style.height = pos.height + '%';
      mask.textContent = 'RUPTURE';
      if (DEBUG) {
        mask.style.opacity = '0.45';
        mask.style.background = 'rgba(255, 235, 59, 0.35)';
        mask.style.borderColor = '#FFEB3B';
        mask.style.color = '#FFEB3B';
        mask.style.fontSize = '0.9vw';
        mask.textContent = productName;
      }
      overlay.appendChild(mask);
    }
  }

  // Charger le stock depuis Supabase
  function loadStock() {
    if (!storeId) {
      updateStatus('warning', 'BOUTIQUE NON CONFIGURÉE');
      return;
    }

    fetch(SUPABASE_URL + '/rest/v1/menu_items?select=name,id&is_active=eq.true', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (items) {
      var itemIds = items.map(function (i) { return i.id; });
      var itemNames = {};
      items.forEach(function (i) { itemNames[i.id] = i.name; });

      // Charger le stock
      return fetch(SUPABASE_URL + '/rest/v1/menu_stock?select=item_id,in_stock&store_id=eq.' + storeId, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (stock) {
        // Appliquer les masques
        var stockMap = {};
        stock.forEach(function (s) {
          stockMap[s.item_id] = s.in_stock;
        });

        document.querySelectorAll('.product-mask').forEach(function (mask) {
          var productName = mask.dataset.product;
          var item = items.find(function (i) { return i.name === productName; });

          if (item) {
            var inStock = stockMap[item.id];
            if (inStock === false) {
              mask.classList.add('out-of-stock');
            } else {
              mask.classList.remove('out-of-stock');
            }
          }
        });

        // Mise à jour réussie
        var now = new Date();
        var timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        updateStatus('online', 'MAJ ' + timeStr);
      });
    })
    .catch(function (err) {
      console.error('Erreur chargement stock:', err);
      updateStatus('offline', 'HORS LIGNE');
    });
  }

  // Init
  createProductMasks();
  loadStock();

  // Refresh toutes les 60s
  setInterval(loadStock, 60000);

  // Plein écran
  document.addEventListener('click', function () {
    var el = document.documentElement;
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  });
})();
</script>
</body>
</html>
